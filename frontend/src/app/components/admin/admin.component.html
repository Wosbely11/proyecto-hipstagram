<div class="flex h-screen bg-gray-100 font-sans">

  <aside class="w-64 bg-gray-900 text-white flex flex-col shadow-xl">
    <div class="p-6 border-b border-gray-800">
      <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-linear-to-r from-hipstagram-primary to-blue-400">
        Admin Panel
      </h1>
      <p class="text-xs text-gray-400 mt-1">Hipstagram Control Center</p>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-2">
      <button 
        (click)="cambiarVista('usuarios')"
        [class.bg-gray-800]="vistaActual === 'usuarios'"
        [class.border-l-4]="vistaActual === 'usuarios'"
        [class.border-hipstagram-primary]="vistaActual === 'usuarios'"
        class="w-full flex items-center space-x-3 px-4 py-3 text-sm font-medium rounded-r-lg hover:bg-gray-800 transition-colors text-left text-gray-300 hover:text-white">
        <span class="text-lg">👥</span>
        <span>Gestión de Usuarios</span>
      </button>

      <button 
        (click)="cambiarVista('auditoria')"
        [class.bg-gray-800]="vistaActual === 'auditoria'"
        [class.border-l-4]="vistaActual === 'auditoria'"
        [class.border-hipstagram-primary]="vistaActual === 'auditoria'"
        class="w-full flex items-center space-x-3 px-4 py-3 text-sm font-medium rounded-r-lg hover:bg-gray-800 transition-colors text-left text-gray-300 hover:text-white">
        <span class="text-lg">📋</span>
        <span>Auditoría de Logs</span>
      </button>

      <button 
        (click)="cambiarVista('moderacion')"
        [class.bg-gray-800]="vistaActual === 'moderacion'"
        [class.border-l-4]="vistaActual === 'moderacion'"
        [class.border-hipstagram-primary]="vistaActual === 'moderacion'"
        class="w-full flex items-center space-x-3 px-4 py-3 text-sm font-medium rounded-r-lg hover:bg-gray-800 transition-colors text-left text-gray-300 hover:text-white">
        <span class="text-lg">🛡️</span>
        <span>Moderación</span>
      </button>
    </nav>

    <div class="p-4 border-t border-gray-800">
      <button (click)="cerrarSesion()" class="w-full flex items-center justify-center space-x-2 text-sm text-gray-400 hover:text-red-400 transition-colors py-2">
        <span>🚪</span>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50">
    <div class="p-8 max-w-7xl mx-auto">
      
      <div *ngIf="vistaActual === 'usuarios'" class="animate-fade-in">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Usuarios Registrados</h2>
        <div class="bg-white p-10 rounded-xl shadow-sm border border-gray-200 flex items-center justify-center text-gray-400">
          <p>La tabla de usuarios se cargará aquí...</p>
        </div>
      </div>

      <div *ngIf="vistaActual === 'auditoria'" class="animate-fade-in">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Logs del Sistema</h2>
        <div class="bg-white p-10 rounded-xl shadow-sm border border-gray-200 flex items-center justify-center text-gray-400">
          <p>El registro de auditoría se cargará aquí...</p>
        </div>
      </div>

      <div *ngIf="vistaActual === 'moderacion'" class="animate-fade-in">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Moderación de Contenido</h2>
        <div class="bg-white p-10 rounded-xl shadow-sm border border-gray-200 flex items-center justify-center text-gray-400">
          <p>El panel de moderación se cargará aquí...</p>
        </div>
      </div>

    </div>
  </main>
</div>
